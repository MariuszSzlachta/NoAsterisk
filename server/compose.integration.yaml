services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DATABASE_NAME:?POSTGRES_TEST_DATABASE_NAME is required}
      POSTGRES_USER: ${POSTGRES_TEST_DATABASE_USER:?POSTGRES_TEST_DATABASE_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_DATABASE_PASSWORD:?POSTGRES_TEST_DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 1s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/postgresql/data
      - /tmp
      - /run
