services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-budget}
      POSTGRES_USER: ${DB_USER:-budget_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-budget_app} -d ${DB_NAME:-budget}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run

volumes:
  pgdata:
    driver: local
